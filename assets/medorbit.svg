<svg width="1000" height="330" viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MedOrbit</title>
  <desc id="desc">Evidence-first medication safety using Go, Python, gRPC, and traceable clinical workflows.</desc>
  <style>
    :root {
      --background: #F0F6FF;
      --surface: #FFFFFF;
      --primary: #10243E;
      --secondary: #46617F;
      --border: #C9D9EC;
      --line: #90ACCA;
      --tag: #E3EEFC;
      --tag-text: #294967;
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #07111D;
        --surface: #0E2033;
        --primary: #F4F8FC;
        --secondary: #AAC0D8;
        --border: #29445F;
        --line: #50789E;
        --tag: #17324D;
        --tag-text: #C7DDF2;
      }
    }
  </style>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1000" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--surface)" stop-opacity=".92"/>
      <stop offset="1" stop-color="var(--background)"/>
    </linearGradient>
    <linearGradient id="orb" x1="680" y1="73" x2="898" y2="271" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4285F4"/>
      <stop offset=".48" stop-color="#7CB7FF"/>
      <stop offset="1" stop-color="#34A853"/>
    </linearGradient>
    <filter id="soft" x="622" y="22" width="330" height="305" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1000" height="330" rx="30" fill="url(#wash)"/>
  <rect x=".75" y=".75" width="998.5" height="328.5" rx="29.25" stroke="var(--border)" stroke-width="1.5"/>

  <g transform="translate(52 49)">
    <text fill="var(--secondary)" font-size="21" font-weight="650" letter-spacing="2.5">01 / CLINICAL SYSTEMS</text>
    <text y="74" fill="var(--primary)" font-size="59" font-weight="720" letter-spacing="-2">MedOrbit</text>
    <text y="122" fill="var(--primary)" font-size="34" font-weight="550" letter-spacing="-.55">Evidence-first medication safety.</text>
    <text y="165" fill="var(--secondary)" font-size="28" font-weight="450">Traceable clinical workflows, from evidence retrieval</text>
    <text y="197" fill="var(--secondary)" font-size="28" font-weight="450">to an auditable decision.</text>
    <g transform="translate(0 215)" font-size="22" font-weight="650" text-anchor="middle">
      <rect width="63" height="34" rx="17" fill="var(--tag)"/><text x="31.5" y="22" fill="var(--tag-text)">Go</text>
      <rect x="72" width="92" height="34" rx="17" fill="var(--tag)"/><text x="118" y="22" fill="var(--tag-text)">Python</text>
      <rect x="173" width="79" height="34" rx="17" fill="var(--tag)"/><text x="212.5" y="22" fill="var(--tag-text)">gRPC</text>
    </g>
  </g>

  <g aria-hidden="true">
    <circle cx="802" cy="166" r="112" fill="#4285F4" fill-opacity=".12" filter="url(#soft)"/>
    <circle cx="802" cy="166" r="89" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 9"/>
    <circle cx="802" cy="166" r="60" fill="url(#orb)"/>
    <path d="M759 124L845 208M845 124L759 208" stroke="#FFFFFF" stroke-opacity=".82" stroke-width="13" stroke-linecap="round"/>
    <circle cx="802" cy="77" r="9" fill="#EA4335"/>
    <circle cx="891" cy="166" r="9" fill="#FBBC05"/>
    <circle cx="802" cy="255" r="9" fill="#34A853"/>
  </g>
</svg>
