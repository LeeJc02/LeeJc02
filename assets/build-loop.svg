<svg width="1200" height="170" viewBox="0 0 1200 170" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LeeJc02 build loop</title>
  <desc id="desc">An animated five-step engineering loop from idea to architecture, build, verification, and shipping.</desc>
  <style>
    .signal { animation: signal 8s linear infinite; }
    .node { animation: node 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .node-2 { animation-delay: .6s; }
    .node-3 { animation-delay: 1.2s; }
    .node-4 { animation-delay: 1.8s; }
    .node-5 { animation-delay: 2.4s; }
    @keyframes signal { to { stroke-dashoffset: -180; } }
    @keyframes node { 0%, 100% { opacity: .5; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .signal, .node { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="25" y1="0" x2="1170" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07131D"/>
      <stop offset="0.55" stop-color="#0B111B"/>
      <stop offset="1" stop-color="#120B20"/>
    </linearGradient>
    <linearGradient id="wire" x1="100" y1="0" x2="1095" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.52" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="169" rx="18.5" fill="url(#bg)" stroke="#38BDF8" stroke-opacity="0.15"/>
  <path d="M105 77H1095" stroke="#1E293B" stroke-width="2"/>
  <path class="signal" d="M105 77H1095" stroke="url(#wire)" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 18"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <g transform="translate(105 77)">
      <circle class="node" r="10" fill="#07131D" stroke="#38BDF8" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="-28" text-anchor="middle" fill="#E2E8F0" font-size="13" letter-spacing="1.8">IDEA</text>
      <text x="0" y="42" text-anchor="middle" fill="#475569" font-size="10">question</text>
    </g>
    <g transform="translate(350 77)">
      <circle class="node node-2" r="10" fill="#07131D" stroke="#38BDF8" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="-28" text-anchor="middle" fill="#E2E8F0" font-size="13" letter-spacing="1.8">ARCHITECT</text>
      <text x="0" y="42" text-anchor="middle" fill="#475569" font-size="10">contract</text>
    </g>
    <g transform="translate(600 77)">
      <circle class="node node-3" r="10" fill="#07131D" stroke="#67E8F9" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="-28" text-anchor="middle" fill="#E2E8F0" font-size="13" letter-spacing="1.8">BUILD</text>
      <text x="0" y="42" text-anchor="middle" fill="#475569" font-size="10">software</text>
    </g>
    <g transform="translate(850 77)">
      <circle class="node node-4" r="10" fill="#07131D" stroke="#A78BFA" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="-28" text-anchor="middle" fill="#E2E8F0" font-size="13" letter-spacing="1.8">VERIFY</text>
      <text x="0" y="42" text-anchor="middle" fill="#475569" font-size="10">evidence</text>
    </g>
    <g transform="translate(1095 77)">
      <circle class="node node-5" r="10" fill="#07131D" stroke="#A78BFA" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="-28" text-anchor="middle" fill="#E2E8F0" font-size="13" letter-spacing="1.8">SHIP</text>
      <text x="0" y="42" text-anchor="middle" fill="#A78BFA" font-size="10">iterate</text>
    </g>
    <text x="28" y="151" fill="#334155" font-size="9" letter-spacing="1.5">BUILD LOOP / CONTINUOUS</text>
    <text x="1172" y="151" text-anchor="end" fill="#334155" font-size="9" letter-spacing="1.5">MAKE IT WORK · MAKE IT CLEAR · MAKE IT BETTER</text>
  </g>
</svg>
