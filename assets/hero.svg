<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LeeJc02 profile banner</title>
  <desc id="desc">A deep-space developer banner with animated orbital paths and system status details.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="20" x2="1130" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="0.52" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#130B2B"/>
    </linearGradient>
    <linearGradient id="accent" x1="380" y1="0" x2="815" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(881 178) rotate(90) scale(154 276)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blurred"/>
      <feMerge><feMergeNode in="blurred"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#38BDF8" stroke-opacity="0.055"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse cx="881" cy="178" rx="276" ry="154" fill="url(#glow)"/>
    <circle cx="1040" cy="50" r="86" fill="#0EA5E9" fill-opacity="0.08" filter="url(#blur)"/>
    <circle cx="115" cy="330" r="115" fill="#7C3AED" fill-opacity="0.09" filter="url(#blur)"/>

    <g opacity="0.85">
      <circle cx="870" cy="178" r="48" stroke="#38BDF8" stroke-opacity="0.28"/>
      <circle cx="870" cy="178" r="94" stroke="#A78BFA" stroke-opacity="0.18" stroke-dasharray="5 8"/>
      <ellipse cx="870" cy="178" rx="162" ry="70" transform="rotate(-16 870 178)" stroke="#38BDF8" stroke-opacity="0.35" stroke-dasharray="4 7"/>
      <ellipse cx="870" cy="178" rx="217" ry="98" transform="rotate(20 870 178)" stroke="#A78BFA" stroke-opacity="0.18"/>
      <circle cx="870" cy="178" r="17" fill="#38BDF8" fill-opacity="0.16" stroke="#67E8F9" filter="url(#softGlow)"/>
      <circle cx="870" cy="178" r="5" fill="#E0F2FE"/>

      <circle r="5" fill="#67E8F9" filter="url(#softGlow)">
        <animateMotion dur="7s" repeatCount="indefinite" path="M708 178a162 70 -16 1 0 324 0a162 70 -16 1 0 -324 0"/>
      </circle>
      <circle r="4" fill="#C4B5FD" filter="url(#softGlow)">
        <animateMotion dur="11s" repeatCount="indefinite" path="M653 178a217 98 20 1 1 434 0a217 98 20 1 1 -434 0"/>
      </circle>
    </g>

    <g fill="#E0F2FE">
      <circle cx="705" cy="65" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="125" r="1"><animate attributeName="opacity" values="1;0.15;1" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="1030" cy="295" r="1.3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="278" r="1"><animate attributeName="opacity" values="0.25;1;0.25" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="42" r="1"/>
      <circle cx="1150" cy="250" r="1"/>
      <circle cx="760" cy="315" r="1"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <text x="70" y="74" fill="#38BDF8" font-size="14" letter-spacing="3">SYSTEM / ONLINE</text>
      <circle cx="49" cy="69" r="5" fill="#22C55E" filter="url(#softGlow)">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="48" y="164" fill="url(#accent)" font-size="72" font-weight="700" letter-spacing="-3">LeeJc02</text>
      <text x="52" y="207" fill="#C9D1D9" font-size="18" letter-spacing="1.5">BUILDING RELIABLE SYSTEMS</text>
      <text x="52" y="239" fill="#64748B" font-size="14">from idea → architecture → production</text>

      <rect x="50" y="279" width="440" height="1" fill="url(#accent)" opacity="0.55"/>
      <text x="51" y="310" fill="#64748B" font-size="12" letter-spacing="1">GO</text>
      <text x="105" y="310" fill="#334155" font-size="12">/</text>
      <text x="127" y="310" fill="#64748B" font-size="12" letter-spacing="1">TYPESCRIPT</text>
      <text x="238" y="310" fill="#334155" font-size="12">/</text>
      <text x="260" y="310" fill="#64748B" font-size="12" letter-spacing="1">PYTHON</text>
      <text x="340" y="310" fill="#334155" font-size="12">/</text>
      <text x="362" y="310" fill="#64748B" font-size="12" letter-spacing="1">C++</text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">
      <text x="1030" y="321" fill="#475569">ORBIT 02</text>
      <path d="M1030 329h93" stroke="#334155"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="23.5" stroke="#38BDF8" stroke-opacity="0.18"/>
</svg>
