<svg width="1000" height="440" viewBox="0 0 1000 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">I build software with a point of view.</title>
  <desc id="desc">LeeJc02 is a computer science student and open-source builder exploring agents, distributed systems, and the modern web.</desc>
  <style>
    :root {
      --background: #F5F5F7;
      --surface: #FFFFFF;
      --primary: #1D1D1F;
      --secondary: #5B5B61;
      --border: #D8D8DC;
      --island: #000000;
      --island-text: #F5F5F7;
      --ambient: #FFFFFF;
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .state { transform-origin: 500px 339px; animation: state 12s cubic-bezier(.4, 0, .2, 1) infinite; }
    .state-two { animation-delay: -8s; }
    .state-three { animation-delay: -4s; }
    @keyframes state {
      0%, 28% { opacity: 1; transform: scale(.985); }
      33%, 95% { opacity: 0; transform: scale(.94); }
      100% { opacity: 1; transform: scale(.985); }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #000000;
        --surface: #151517;
        --primary: #F5F5F7;
        --secondary: #A1A1A8;
        --border: #343438;
        --island: #161618;
        --island-text: #FFFFFF;
        --ambient: #A7C7FF;
      }
      .island-edge { stroke: #FFFFFF; stroke-opacity: .18; }
      .island-glow { opacity: .28; }
    }
    @media (prefers-reduced-motion: reduce) {
      .state { animation: none; opacity: 0; transform: none; }
      .state-one { opacity: 1; }
    }
  </style>
  <defs>
    <filter id="shadow" x="280" y="278" width="440" height="126" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="19" flood-color="#000000" flood-opacity=".18"/>
    </filter>
    <filter id="glow" x="292" y="290" width="416" height="98" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <linearGradient id="edge" x1="330" y1="300" x2="670" y2="378" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".16"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="440" rx="34" fill="var(--background)"/>
  <rect x=".75" y=".75" width="998.5" height="438.5" rx="33.25" stroke="var(--border)" stroke-opacity=".72" stroke-width="1.5"/>

  <g aria-hidden="true">
    <circle cx="74" cy="72" r="6" fill="#4285F4"/>
    <circle cx="94" cy="72" r="6" fill="#EA4335"/>
    <circle cx="114" cy="72" r="6" fill="#FBBC05"/>
    <circle cx="134" cy="72" r="6" fill="#34A853"/>
  </g>

  <g text-anchor="middle">
    <text x="500" y="159" fill="var(--primary)" font-size="65" font-weight="700" letter-spacing="-2.8">I build software</text>
    <text x="500" y="226" fill="var(--primary)" font-size="65" font-weight="700" letter-spacing="-2.8">with a point of view.</text>
    <text x="500" y="266" fill="var(--secondary)" font-size="28" font-weight="450" letter-spacing="-.25">Computer science student and open-source builder, exploring agents,</text>
    <text x="500" y="298" fill="var(--secondary)" font-size="28" font-weight="450" letter-spacing="-.25">distributed systems, and the modern web.</text>
  </g>

  <rect class="island-glow" x="330" y="314" width="340" height="50" rx="25" fill="var(--ambient)" opacity="0" filter="url(#glow)"/>
  <g filter="url(#shadow)">
    <g class="state state-one">
      <rect class="island-edge" x="338" y="310" width="324" height="58" rx="29" fill="var(--island)" stroke="url(#edge)"/>
      <circle cx="369" cy="339" r="4" fill="#34A853"/>
      <text x="500" y="346" fill="var(--island-text)" font-size="22" font-weight="600" text-anchor="middle" letter-spacing="-.1">Building useful systems</text>
    </g>
    <g class="state state-two">
      <rect class="island-edge" x="325" y="310" width="350" height="58" rx="29" fill="var(--island)" stroke="url(#edge)"/>
      <circle cx="356" cy="339" r="4" fill="#4285F4"/>
      <text x="500" y="346" fill="var(--island-text)" font-size="22" font-weight="600" text-anchor="middle" letter-spacing="-.1">Exploring agentic ideas</text>
    </g>
    <g class="state state-three">
      <rect class="island-edge" x="346" y="310" width="308" height="58" rx="29" fill="var(--island)" stroke="url(#edge)"/>
      <circle cx="377" cy="339" r="4" fill="#FBBC05"/>
      <text x="500" y="346" fill="var(--island-text)" font-size="22" font-weight="600" text-anchor="middle" letter-spacing="-.1">Shipping with proof</text>
    </g>
  </g>
</svg>
